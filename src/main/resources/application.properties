server.port=${PORT:8080}

spring.application.name=omtb-backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/MTBS}
spring.data.mongodb.database=${MONGODB_DATABASE:MTBS}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
